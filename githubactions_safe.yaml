name: Safe PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        shell: bash
        run: |
          PR_TITLE="$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")"

          PR_TITLE="$(printf '%s' "$PR_TITLE" | tr -d '\000-\037\177' | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | head -c 200)"
          if [[ "$PR_TITLE" =~ ^production ]]; then
            echo "PR title starts with 'production'"
          else
            echo "PR title did not start with 'production'"
            exit 1
          fi
